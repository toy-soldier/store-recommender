spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 100
        one-indexed-parameters: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
