server:
  port: 8081

spring:
  application:
    name: api-server
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 100
        one-indexed-parameters: true
  sql:
    init:
      mode: always
