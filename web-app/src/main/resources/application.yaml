server:
  port: 8080

spring:
  application:
    name: web-app
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
  servlet:
    multipart:
      max-request-size: 1MB

app:
  api-server:
    base-url: http://localhost:8081
  models:
    parser: gpt-5-mini
    recommender: gpt-4o-mini
  fuzzy:
    top-n: 5
    min-score: 60
  inventory:
    load-on-startup: true
  dummy-mode:
    enabled: false
    grocery-lists: classpath:dummy/grocery-lists/
    parser-responses: classpath:dummy/parser-responses/
    recommender-responses: classpath:dummy/recommender-responses/

retry:
  api-server:
    max-attempts: 3
    backoff:
      delay-ms: 500
      multiplier: 2.0
  openai:
    max-attempts: 4
    backoff:
      delay-ms: 1000
      multiplier: 2.0
